<html lang="hi">

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <style>
        :root { --gold: #D4AF37; --dark: #0a0a0a; --red: #e63946; --green: #10b981; --orange: #f59e0b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--dark); color: #fff; font-family: 'Poppins', sans-serif; min-height: 100vh; }
        h1, h2, h3, .font-luxury { font-family: 'Cinzel', serif; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 1rem;
            padding: 1.25rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        .stat-card:hover { border-color: rgba(212,175,55,0.3); transform: translateY(-2px); }

        .order-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 1.25rem;
            padding: 1.25rem;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .order-card.status-new { border-left: 4px solid var(--red); }
        .order-card.status-preparing { border-left: 4px solid var(--orange); }
        .order-card.status-done { border-left: 4px solid var(--green); opacity: 0.6; }
        .order-card.status-done .done-overlay {
            position: absolute; inset: 0; background: rgba(16,185,129,0.05);
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .order-card.removing {
            animation: slideOut 0.5s ease forwards;
        }
        @keyframes slideOut {
            0% { opacity: 1; transform: translateX(0) scale(1); }
            100% { opacity: 0; transform: translateX(80px) scale(0.9); height: 0; padding: 0; margin: 0; border: 0; overflow: hidden; }
        }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .order-card.entering { animation: slideIn 0.4s ease forwards; }

        .btn-complete {
            background: rgba(16,185,129,0.1);
            color: var(--green);
            border: 1px solid rgba(16,185,129,0.3);
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        .btn-complete:hover { background: var(--green); color: #000; }
        .btn-complete:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-preparing {
            background: rgba(245,158,11,0.1);
            color: var(--orange);
            border: 1px solid rgba(245,158,11,0.3);
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        .btn-preparing:hover { background: var(--orange); color: #000; }
        .btn-preparing:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-clear {
            background: linear-gradient(135deg, var(--gold), #b8941e);
            color: #000;
            padding: 0.75rem 2rem;
            border-radius: 1rem;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            border: none;
            transition: all 0.25s ease;
        }
        .btn-clear:hover { box-shadow: 0 0 25px rgba(212,175,55,0.4); transform: translateY(-2px); }
        .btn-clear:active { transform: scale(0.97); }
        .btn-clear:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        .btn-delete {
            background: rgba(230,57,70,0.1);
            color: var(--red);
            border: 1px solid rgba(230,57,70,0.3);
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        .btn-delete:hover { background: var(--red); color: #fff; }

        .badge-new { background: var(--red); color: #fff; padding: 0.2rem 0.75rem; border-radius: 999px; font-size: 0.65rem; font-weight: 800; letter-spacing: 0.15em; }
        .badge-preparing { background: var(--orange); color: #000; padding: 0.2rem 0.75rem; border-radius: 999px; font-size: 0.65rem; font-weight: 800; letter-spacing: 0.15em; }
        .badge-done { background: var(--green); color: #fff; padding: 0.2rem 0.75rem; border-radius: 999px; font-size: 0.65rem; font-weight: 800; letter-spacing: 0.15em; }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #111; border: 1px solid rgba(212,175,55,0.3);
            color: var(--gold); padding: 0.75rem 1.5rem; border-radius: 1rem;
            font-size: 0.85rem; font-weight: 600; z-index: 999;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2s forwards;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-50%) translateY(20px); } }

        .empty-state { text-align: center; padding: 4rem 2rem; color: rgba(255,255,255,0.15); }
        .empty-state i { font-size: 4rem; margin-bottom: 1rem; }

        .sound-toggle {
            position: fixed; top: 1rem; right: 1rem; z-index: 50;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--gold); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease; font-size: 1rem;
        }
        .sound-toggle:hover { background: rgba(212,175,55,0.1); border-color: var(--gold); }
    </style>
</head>

   // ===== 10 SEC BELL SOUND =====
function playBellAlarm10Sec() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const startTime = ctx.currentTime;
        const duration = 10;

        // Master gain for bell
        const master = ctx.createGain();
        master.gain.setValueAtTime(0.25, startTime);
        master.connect(ctx.destination);

        // Bell tone - repeating ding-dong every 1.2 sec
        for (let t = 0; t < duration; t += 1.2) {
            // First "ding"
            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(880, startTime + t);
            gain1.gain.setValueAtTime(0, startTime + t);
            gain1.gain.linearRampToValueAtTime(1, startTime + t + 0.01);
            gain1.gain.exponentialRampToValueAtTime(0.001, startTime + t + 0.4);
            osc1.connect(gain1);
            gain1.connect(master);
            osc1.start(startTime + t);
            osc1.stop(startTime + t + 0.45);

            // Second "dong" (slightly lower)
            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(660, startTime + t + 0.4);
            gain2.gain.setValueAtTime(0, startTime + t + 0.4);
            gain2.gain.linearRampToValueAtTime(1, startTime + t + 0.41);
            gain2.gain.exponentialRampToValueAtTime(0.001, startTime + t + 0.8);
            osc2.connect(gain2);
            gain2.connect(master);
            osc2.start(startTime + t + 0.4);
            osc2.stop(startTime + t + 0.85);
        }

        // Stop cleanly after 10 sec
        setTimeout(() => {
            master.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
            setTimeout(() => ctx.close(), 300);
        }, 10000);
    } catch (e) {
        console.error('Bell error:', e);
    }
}

    function playBeep() {
        if (!soundEnabled) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 800;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.5);
        } catch (e) { console.error(e); }
    }
